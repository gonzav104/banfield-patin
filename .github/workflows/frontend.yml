name: frontend

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion:
    name: Verificación (tipos, lint, pruebas y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # La versión exacta vive en frontend/.node-version: la misma que se usa en local.
      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Pruebas (Vitest, con backend simulado)
        run: npm test

      - name: Build de producción
        run: npm run build

  # Aparte de la verificación: un aviso nuevo del registro de npm falla este job sin que el código haya cambiado,
  # y así se distingue de una regresión real.
  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version

      - name: Pruebas del evaluador de la auditoría
        run: node --test ../.github/scripts/auditoria-npm.test.mjs

      # `npm audit` con el umbral en `moderate`; solo acepta los avisos listados, con motivo y vencimiento, en
      # .github/auditoria-excepciones.json (ver .github/scripts/auditoria-npm.mjs). Usa solo package-lock.json; no hace falta instalar.
      - name: npm audit (con excepciones acotadas y con vencimiento)
        run: node ../.github/scripts/auditoria-npm.mjs

  # Flujos reales: navegador -> Vite -> backend Spring -> PostgreSQL. La suite se reparte en shards (frontend/e2e/shards.json): cada
  # shard es un runner independiente con su propia base PostgreSQL descartable, backend, frontend y credenciales efimeras (nada
  # sensible en el repositorio). Dentro de cada shard sigue habiendo un unico worker, para no abrir concurrencia sobre una misma base.
  # Los nombres de estos jobs NO pueden ser el del control protegido: ese nombre es el del job `e2e` de abajo.
  e2e-shard:
    name: E2E reales shard ${{ matrix.shard }} (backend + PostgreSQL descartable)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Sin fail-fast: un shard fallido no cancela al otro, asi se ve el resultado completo de la suite.
      fail-fast: false
      matrix:
        shard: ["1", "2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # El script valida el reparto ANTES de levantar nada (ni falta, ni sobra, ni se repite ningun escenario) y ejecuta solo este shard.
      - name: Ejecutar E2E reales
        env:
          E2E_SHARD: ${{ matrix.shard }}
        run: bash .github/scripts/frontend-e2e.sh

      # Red de seguridad, en CADA shard: los artefactos de texto no deben contener contraseñas, secreto TOTP ni enlaces de invitación.
      - name: Verificar artefactos sensibles
        if: always()
        working-directory: frontend
        run: npm run test:e2e:check-artifacts

  # CONTROL PROTEGIDO. Conserva el nombre exacto que exige la protección de la rama (no se modifica) y solo termina en success cuando
  # TODOS los shards terminaron en success. `always()` es lo que lo hace seguro: sin él, si un shard falla este job quedaría «omitido»
  # y GitHub trata un control omitido como aprobado; con él corre siempre y falla de forma explícita ante un shard fallido,
  # cancelado u omitido.
  e2e:
    name: E2E reales (backend + PostgreSQL descartable)
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Todos los shards de E2E reales en success
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: bash .github/scripts/e2e-gate.sh "$SHARDS_RESULT"
