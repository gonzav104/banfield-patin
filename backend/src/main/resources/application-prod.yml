# El proceso web no recibe credenciales de migración. Flyway debe completarse antes de arrancarlo.
spring:
  flyway:
    enabled: false

# Perfil de produccion (SPRING_PROFILES_ACTIVE=prod). En producción la ruta
# /v3/api-docs no existe (RNF-14: el contrato se obtiene en dev o con un ADMIN en otro entorno; ver docs/SEGURIDAD.md).
springdoc:
  api-docs:
    enabled: false
