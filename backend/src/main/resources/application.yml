spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gestion_patin
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gestion_patin
    default-schema: gestion_patin
