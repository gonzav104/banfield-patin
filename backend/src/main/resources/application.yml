spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gestion_patin
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: gestion_patin
    default-schema: gestion_patin

# Ningun log contiene DNI ni CUIL (REQ-DEP-10), tampoco con un nivel raiz DEBUG/TRACE:
#  - Hibernate registra (a nivel ERROR) el mensaje del servidor PostgreSQL de cada violacion de restriccion, y ese mensaje
#    incluye los VALORES de la clave ("Key (escuela_id, dni)=(..., 12345678) already exists"). Las violaciones de unicidad
#    de DNI/CUIL son parte del flujo normal (409), asi que ese logger se apaga.
#  - Spring MVC, a nivel DEBUG, registra "Resolved [<excepcion>]" con el mensaje COMPLETO de cada excepcion tratada (en una
#    violacion de PostgreSQL incluye los valores de la clave). Esa linea la emite AbstractHandlerExceptionResolver con el
#    logger de la clase concreta del resolutor (verificado en spring-webmvc 7.0.9): ExceptionHandlerExceptionResolver (la
#    que trata los @ExceptionHandler de ManejadorGlobalErrores) y ResponseStatusExceptionResolver. Se fijan en INFO de forma
#    EXPLICITA para que un nivel raiz DEBUG no los active. HandlerExceptionResolverComposite no registra nada.
#    DefaultHandlerExceptionResolver NO se fija: su linea "Resolved [...]" sale a nivel WARN (usa setWarnLogCategory), asi que
#    INFO no la silenciaria; ademas es inalcanzable aqui porque ManejadorGlobalErrores (con un @ExceptionHandler(Exception))
#    resuelve antes cualquier excepcion de un controlador (demostrado en LoggingExcepcionesTratadasTest).
#    Solo queda la linea saneada de la aplicacion (RestriccionViolada / ManejadorGlobalErrores).
#    Pruebas: ConfiguracionLoggingTest y LoggingExcepcionesTratadasTest.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.web.servlet.mvc.annotation.ResponseStatusExceptionResolver: INFO

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

banfield:
  escuela:
    slug: ${ESCUELA_SLUG:banfield-patin-san-pedro}
  frontend:
    url-base: ${FRONTEND_URL_BASE:}
  seguridad:
    jwt:
      secreto: ${JWT_SECRET} # base64, minimo 32 bytes decodificados; sin valor por defecto
      emisor: banfield-patin-backend
      duracion: ${JWT_DURACION:PT8H}
    cookie:
      nombre: ${AUTH_COOKIE_NOMBRE:BP_SESION}
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    cors:
      origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:}
    login:
      max-intentos: ${LOGIN_MAX_INTENTOS:5}
      ventana: ${LOGIN_VENTANA:PT15M}
      bloqueo: ${LOGIN_BLOQUEO:PT15M}
      max-claves: 10000
    mfa:
      clave-cifrado: ${MFA_CLAVE_CIFRADO} # base64 de exactamente 32 bytes (AES-256); sin valor por defecto
      duracion-pendiente: ${MFA_DURACION_PENDIENTE:PT5M}
  invitaciones:
    vigencia-por-defecto: P7D
    vigencia-maxima: P30D
  bootstrap-admin:
    habilitado: ${BOOTSTRAP_ADMIN_HABILITADO:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    nombre: ${BOOTSTRAP_ADMIN_NOMBRE:}
    apellido: ${BOOTSTRAP_ADMIN_APELLIDO:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
